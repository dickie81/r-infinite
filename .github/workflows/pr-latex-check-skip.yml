# Companion to pr-latex-check.yml. That workflow's path filter blocks it
# from running on PRs that don't touch LaTeX sources, leaving "Verify
# LaTeX files build" stuck at pending. This file runs on the *inverse*
# paths and reports a trivial success under the same job name -- GitHub
# treats them as the same status check, so the PR always shows green
# whether or not the real LaTeX build was needed.
name: PR LaTeX Build Check

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - 'src/*.tex'
      - 'src/.latexmkrc'
      - 'tools/**/*.py'
      - 'tools/requirements.txt'
      - '.github/workflows/pr-latex-check.yml'

permissions:
  contents: read

concurrency:
  group: pr-latex-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  latex-build-check:
    name: Verify LaTeX files build
    runs-on: ubuntu-latest
    steps:
      - name: Skip (no LaTeX-affecting files changed)
        run: echo "No src/*.tex, tools/**/*.py, .latexmkrc, requirements.txt, or pr-latex-check.yml changes -- nothing to build."
