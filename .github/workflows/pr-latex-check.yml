name: PR LaTeX Build Check

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/*.tex'
      - 'src/.latexmkrc'
      - 'tools/**/*.py'
      - 'tools/requirements.txt'
      - '.github/workflows/pr-latex-check.yml'

permissions:
  contents: read

concurrency:
  group: pr-latex-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  latex-build-check:
    name: Verify LaTeX files build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: tools/requirements.txt

      - name: Install Python dependencies
        run: pip install -r tools/requirements.txt

      - name: Generate computed tables
        run: |
          python3 tools/build/generate_predictions.py
          python3 tools/build/generate_bao_table.py

      - name: Check xr-hyper compliance (no cross-paper \cite)
        run: python3 tools/build/check_xr_hyper_compliance.py

      # Warmup pass: populate every paper's .aux file so xr-hyper can read
      # cross-paper labels on the strict pass below. .latexmkrc has
      # $warnings_as_errors = 1, which trips on undefined cross-paper refs
      # when the target's .aux doesn't yet exist (e.g. part2-equals-3.tex
      # references labels in part3.tex / part4b.tex / part6.tex which are
      # alphabetically compiled later).
      #
      # The warmup runs inside the latex-action's TeX Live container (via
      # pre_compile), per-file with -interaction=nonstopmode and
      # warnings_as_errors disabled, so every paper produces an .aux
      # regardless of unresolved references. The main latex-action step
      # then runs strict; with all .aux files present, xr-hyper resolves
      # every \ref{paperK:label}.
      - name: Compile LaTeX files
        uses: xu-cheng/latex-action@v4
        with:
          working_directory: src
          root_file: "*.tex"
          pre_compile: |
            for f in cascade-series-*.tex; do
              latexmk -pdf -interaction=nonstopmode \
                -e '$warnings_as_errors=0;' "$f" || true
            done

      - name: Check for LaTeX warnings and regressions
        run: python3 tools/build/check_latex_warnings.py

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: latex-build-logs
          path: |
            src/build/*.log
            src/build/*.fls
          if-no-files-found: ignore
          retention-days: 7
