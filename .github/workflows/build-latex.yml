name: Build LaTeX PDFs

on:
  push:
    branches: [main]
    paths:
      - 'src/*.tex'
      - 'tools/**/*.py'
      - 'web/**'
      - '.github/workflows/build-latex.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: tools/requirements.txt

      - name: Install Python dependencies
        run: pip install -r tools/requirements.txt

      - name: Generate computed tables
        run: |
          python3 tools/build/generate_predictions.py
          python3 tools/build/generate_bao_table.py

      - name: Check xr-hyper compliance (no cross-paper \cite)
        run: python3 tools/build/check_xr_hyper_compliance.py

      # Warmup pass for xr-hyper. See pr-latex-check.yml for the explanation;
      # same configuration here so push and PR builds agree.
      - name: Compile LaTeX files
        uses: xu-cheng/latex-action@v4
        with:
          working_directory: src
          root_file: "*.tex"
          pre_compile: |
            for f in cascade-series-*.tex; do
              latexmk -pdf -interaction=nonstopmode \
                -e '$warnings_as_errors=0;' "$f" || true
            done

      - name: Check for LaTeX warnings and regressions
        run: python3 tools/build/check_latex_warnings.py

      - name: Prepare site
        run: |
          mkdir -p _site
          cp -r web/** _site/
          cp src/*.pdf _site/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
